name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build -trimpath -ldflags "-s -w" -o cops.exe .
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path cops.exe -DestinationPath cops-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cops-windows-x64
          path: cops-windows-x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Build arm64 + amd64, merge universal
        run: |
          CGO_ENABLED=1 GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o cops-arm64 .
          CGO_ENABLED=1 GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o cops-amd64 .
          lipo -create -output cops cops-arm64 cops-amd64
          tar -czf cops-macos-universal.tar.gz cops
      - uses: actions/upload-artifact@v4
        with:
          name: cops-macos-universal
          path: cops-macos-universal.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" cops-windows-x64.zip cops-macos-universal.tar.gz --generate-notes
